<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OjoolaChat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #e5ddd5;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      background: #efeae2;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 20px;
    }

    .online {
      font-size: 12px;
      opacity: 0.9;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.4;
    }

    .received {
      align-self: flex-start;
      background: white;
    }

    .sent {
      align-self: flex-end;
      background: #d9fdd3;
    }

    .sender {
      font-size: 11px;
      font-weight: bold;
      color: #075e54;
      margin-bottom: 3px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #f0f0f0;
    }

    input {
      flex: 1;
      border: none;
      border-radius: 25px;
      padding: 13px 16px;
      font-size: 15px;
      outline: none;
    }

    button {
      border: none;
      background: #075e54;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div>
        <h1>OjoolaChat</h1>
        <div class="online">Friends chat</div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="message received">
        <div class="sender">OjoolaChat</div>
        Welcome to OjoolaChat 👋
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
      >

      <button onclick="sendMessage()">➤</button>
    </div>

  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const messages = document.getElementById("messages");

      const text = input.value.trim();

      if (text === "") {
        return;
      }

      const message = document.createElement("div");
      message.className = "message sent";
      message.textContent = text;

      messages.appendChild(message);

      input.value = "";

      messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById("messageInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
