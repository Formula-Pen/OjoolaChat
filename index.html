<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OjoolaChat</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{margin:0;background:linear-gradient(135deg,#2563eb,#1e40af);min-height:100vh;color:#fff}
.wrap{max-width:480px;margin:0 auto;padding:28px 20px}
.logo{font-size:28px;font-weight:800;text-align:center;margin-top:30px}
.sub{text-align:center;opacity:.9;margin:8px 0 24px}
.card{background:#fff;color:#111;border-radius:20px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
h2{margin:0 0 6px;font-size:22px}
p.muted{color:#666;font-size:14px;margin:0 0 16px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin-bottom:12px;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button.sec{background:#eef2ff;color:#2563eb;margin-top:10px}
#msg{color:#dc2626;font-size:13px;min-height:18px;text-align:center;margin-top:10px}
#chatCard{display:none}
#messages{height:320px;overflow-y:auto;border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:12px;background:#f9fafb}
.bubble{background:#fff;border:1px solid #e5e7eb;padding:8px 10px;border-radius:12px;margin-bottom:8px}
.bubble b{font-size:13px}
.bubble span{font-size:13px;color:#333;display:block;word-break:break-word}
.bubble small{font-size:11px;color:#888}
.row{display:flex;gap:8px}
.row input{margin:0}
.row button{width:90px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top button{width:auto;padding:8px 14px;background:#fee2e2;color:#991b1b;font-size:13px}
.badge{text-align:center;background:#dcfce7;color:#166534;padding:8px;border-radius:10px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">💬 OjoolaChat</div>
<div class="sub">Connect with Family and Friends</div>

<!-- LOGIN / SIGNUP -->
<div class="card" id="authCard">
<h2 id="authTitle">Welcome back</h2>
<p class="muted" id="authSub">Login with your email to continue.</p>
<input id="nameInput" placeholder="Your Name (for Sign Up only)" style="display:none">
<input id="emailInput" type="email" placeholder="Email address">
<input id="passInput" type="password" placeholder="Password (min 6 characters)">
<button id="mainBtn">Login</button>
<button class="sec" id="toggleBtn">Don't have account? Create Account</button>
<div id="msg"></div>
<div style="text-align:center;margin-top:14px;font-size:12px;color:#999">✅ Firebase Connected • ojoolachat</div>
</div>

<!-- CHAT -->
<div class="card" id="chatCard">
<div class="top"><div><b id="userLabel">Chat</b><div style="font-size:12px;color:#666">Family & Friends</div></div><button id="logoutBtn">Logout</button></div>
<div class="badge">✅ Connected to Firebase</div>
<div id="messages"></div>
<div class="row"><input id="textInput" placeholder="Type a message..."><button id="sendBtn">Send</button></div>
<div id="msg2" style="color:#dc2626;font-size:13px;min-height:18px;text-align:center;margin-top:8px"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBXU6HnCTOAabLEyc3NANNLgZi3OJYpGVk",
  authDomain: "ojoolachat.firebaseapp.com",
  projectId: "ojoolachat",
  storageBucket: "ojoolachat.firebasestorage.app",
  messagingSenderId: "30543009981",
  appId: "1:30543009981:web:10c2641baa64864f96ffd4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let isSignup = false;
const authCard = document.getElementById('authCard');
const chatCard = document.getElementById('chatCard');
const msg = document.getElementById('msg');

document.getElementById('toggleBtn').onclick = () => {
  isSignup = !isSignup;
  document.getElementById('authTitle').textContent = isSignup ? 'Create Account' : 'Welcome back';
  document.getElementById('authSub').textContent = isSignup ? 'Create account with email to join.' : 'Login with your email to continue.';
  document.getElementById('nameInput').style.display = isSignup ? 'block' : 'none';
  document.getElementById('mainBtn').textContent = isSignup ? 'Create Account' : 'Login';
  document.getElementById('toggleBtn').textContent = isSignup ? 'Already have account? Login' : "Don't have account? Create Account";
  msg.textContent = '';
};

document.getElementById('mainBtn').onclick = async () => {
  const name = document.getElementById('nameInput').value.trim();
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value;
  if(!email || !pass){ msg.textContent='Please enter email and password.'; return; }
  if(pass.length < 6){ msg.textContent='Password must be at least 6 characters.'; return; }
  msg.textContent='Please wait...';
  try{
    if(isSignup){
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      if(name) await updateProfile(cred.user, {displayName: name});
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
    msg.textContent='';
  }catch(e){ msg.textContent = e.message; }
};

document.getElementById('logoutBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, (user)=>{
  if(user){
    authCard.style.display='none'; chatCard.style.display='block';
    document.getElementById('userLabel').textContent = 'Hi, ' + (user.displayName || user.email);
    loadMessages();
  } else {
    authCard.style.display='block'; chatCard.style.display='none';
  }
});

function loadMessages(){
  const q = query(collection(db,'messages'), orderBy('createdAt','asc'));
  onSnapshot(q, (snap)=>{
    const box = document.getElementById('messages');
    box.innerHTML='';
    snap.forEach(doc=>{
      const d = doc.data();
      const div = document.createElement('div');
      div.className='bubble';
      div.innerHTML = `<b>${d.name || d.email || 'User'}</b><span>${d.text || ''}</span><small>${d.createdAt?.toDate ? d.createdAt.toDate().toLocaleString() : ''}</small>`;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  });
}

async function send(){
  const inp = document.getElementById('textInput');
  const text = inp.value.trim();
  const user = auth.currentUser;
  if(!text || !user) return;
  try{
    await addDoc(collection(db,'messages'), { text, name: user.displayName || user.email, email: user.email, createdAt: serverTimestamp() });
    inp.value='';
  }catch(e){ document.getElementById('msg2').textContent = e.message; }
}
document.getElementById('sendBtn').onclick = send;
document.getElementById('textInput').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
</script>
</body>
</html>
