<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ojoola</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background:linear-gradient(180deg,#1e40af,#3b82f6,#818cf8);display:flex;justify-content:center;color:#0f172a}
body.dark{background:#0b1220}
button{font-family:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.hidden{display:none!important}

.app{width:100%;max-width:430px;min-height:100dvh;padding:14px;display:flex;flex-direction:column}
.glass{background:rgba(255,255,255,.94);border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);flex:1;display:flex;flex-direction:column;min-height:0}
body.dark .glass{background:#111c33;color:#fff}

/* Auth */
.logo-row{display:flex;gap:10px;justify-content:center;align-items:center}
.logo-row h1{font-size:30px;color:#1e40af;letter-spacing:.3px}
body.dark .logo-row h1{color:#fff}
.logo-icon{width:44px;height:44px;background:#dbeafe;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#1e40af}
h2{font-size:26px;color:#1e40af;text-align:center;margin-top:14px}
body.dark h2{color:#fff}
.sub{text-align:center;color:#475569;font-size:14px;margin:6px 0 14px}
body.dark .sub{color:#cbd5e1}
label{font-size:13px;color:#475569;margin:12px 0 6px;display:block;font-weight:600}
body.dark label{color:#cbd5e1}
.field{display:flex;gap:10px;align-items:center;background:#eef2ff;border-radius:12px;padding:13px 14px}
body.dark .field{background:#1e293b}
.field input,.field select{border:none;outline:none;background:transparent;flex:1;font-size:15px;color:inherit;min-width:0}
.field .at{color:#64748b;font-weight:700}
.eye{border:none;background:none;font-size:13px;font-weight:700;color:#2563eb;cursor:pointer}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.btn-login{background:linear-gradient(90deg,#2563eb,#38bdf8);color:#fff;margin-top:16px}
.btn-google{background:#fff;border:1px solid #e2e8f0;color:#0f172a;display:flex;justify-content:center;gap:10px;font-size:15px;font-weight:600;margin-top:12px}
body.dark .btn-google{background:#1e293b;color:#fff;border-color:#334155}
.btn-outline{width:100%;padding:13px;border:1.5px solid #2563eb;background:transparent;color:#1e40af;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
body.dark .btn-outline{color:#fff;border-color:#fff}
.btn-outline.danger,.logout.danger{color:#dc2626;border-color:#dc2626}
body.dark .btn-outline.danger,body.dark .logout.danger{color:#f87171;border-color:#f87171}
.link{text-align:center;margin-top:14px;font-size:14px;color:#475569}
.link b{color:#1e40af;cursor:pointer;text-decoration:underline}
body.dark .link b{color:#93c5fd}
#msg{text-align:center;font-size:13px;font-weight:600;margin-top:10px;min-height:18px;color:#dc2626}
.tabs{display:flex;background:#eef2ff;border-radius:12px;padding:4px;margin:12px 0}
body.dark .tabs{background:#1e293b}
.tab{flex:1;padding:10px;border:none;border-radius:9px;font-weight:700;cursor:pointer;background:transparent;color:#475569}
body.dark .tab{color:#cbd5e1}
.tab.active{background:#fff;color:#1e40af;box-shadow:0 1px 3px rgba(0,0,0,.12)}
body.dark .tab.active{background:#2563eb;color:#fff}
.divider{text-align:center;color:#94a3b8;font-size:12px;font-weight:700;margin:14px 0 2px}
.note{background:#eff6ff;border-radius:12px;padding:12px;text-align:center;font-size:13px;color:#1e40af}

/* Top bar and lists */
.head{display:flex;justify-content:space-between;align-items:center}
.head .logo-row h1{font-size:24px}
.head .logo-icon{width:36px;height:36px;border-radius:12px}
.top-ava{width:40px;height:40px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;cursor:pointer;flex-shrink:0}
.top-ava img{width:100%;height:100%;object-fit:cover;display:block}
.chats-title{font-size:22px;font-weight:800;color:#1e3a8a;margin:16px 0 10px}
body.dark .chats-title{color:#fff}
.row{display:flex;gap:12px;padding:11px 12px;border-bottom:1px solid #e2e8f0;cursor:pointer;align-items:center}
.row:hover{background:#f1f5f9}
body.dark .row{border-color:#1e293b}
body.dark .row:hover{background:#1e293b}
.ava{width:50px;height:50px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;overflow:hidden;flex-shrink:0;position:relative;cursor:pointer}
.ava img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.ava.lg{width:92px;height:92px;font-size:36px}
.ava.xl{width:150px;height:150px;font-size:60px;cursor:zoom-in}
.dot{position:absolute;bottom:1px;right:1px;width:12px;height:12px;background:#22c55e;border:2px solid #fff;border-radius:50%;pointer-events:none}
.dot.off{background:#94a3b8}
.row b{font-size:16px;font-weight:600}
.row b.unread{font-weight:800}
.row p{font-size:13px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;margin-top:2px}
.row p.unread{font-weight:700;color:#0f172a}
body.dark .row p.unread{color:#fff}
.row .time{font-size:11px;color:#64748b;flex-shrink:0}
.unread-badge{background:#2563eb;color:#fff;font-size:11px;font-weight:700;min-width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
.plus{margin-top:auto;align-self:flex-end;width:56px;height:56px;border:none;border-radius:50%;background:linear-gradient(90deg,#2563eb,#38bdf8);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(37,99,235,.4)}
.plus .ic{width:26px;height:26px}
.empty{text-align:center;padding:24px;color:#64748b;font-size:14px;line-height:1.6}
.section-label{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}

/* Chat */
.chat-screen{padding:0;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(90deg,#1e40af,#2563eb);color:#fff}
.chat-head .ava{width:40px;height:40px;font-size:17px;background:rgba(255,255,255,.2)}
.chat-head .dot{display:none}
.chat-head b{font-size:17px;font-weight:600}
.chat-head small{font-size:12px;opacity:.9}
.back,.icon-btn{width:38px;height:38px;border:none;background:transparent;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:inherit;flex-shrink:0}
.back:hover,.icon-btn:hover{background:rgba(148,163,184,.2)}
.page-head{display:flex;gap:10px;align-items:center;color:#1e3a8a}
.page-head h1{font-size:22px}
body.dark .page-head{color:#fff}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:12px}
.day-sep{align-self:center;background:#fff;color:#475569;font-size:12px;padding:4px 12px;border-radius:8px;margin:8px 0;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.msg{max-width:80%;padding:7px 10px 5px;border-radius:10px;font-size:15px;line-height:1.35;word-break:break-word;position:relative;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.msg.other{align-self:flex-start!important;background:#fff!important;color:#111!important;border-top-left-radius:2px}
.msg.me{align-self:flex-end!important;background:#2563eb!important;color:#fff!important;border-top-right-radius:2px}
.msg-time{font-size:11px;opacity:.7;text-align:right;margin-top:2px;white-space:nowrap}
.sender-name{font-size:12.5px;font-weight:700;color:#2563eb;margin-bottom:2px;cursor:pointer}
.typing-bubble{align-self:flex-start;background:#fff;color:#111;padding:12px 14px;border-radius:10px;border-top-left-radius:2px;display:flex;gap:4px;align-items:center;width:fit-content;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.typing-bubble span{width:7px;height:7px;background:#2563eb;border-radius:50%;display:inline-block;animation:bounce 1s infinite}
.typing-bubble span:nth-child(2){animation-delay:.15s}
.typing-bubble span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.input-row{display:flex;gap:8px;padding:8px 10px;align-items:center;background:#eef2ff}
body.dark .input-row{background:#0f172a}
.input-row .inp{flex:1;display:flex;align-items:center;background:#fff;border-radius:999px;padding:0 16px}
body.dark .input-row .inp{background:#1e293b}
.input-row input{flex:1;border:none;outline:none;background:transparent;font-size:15px;padding:12px 0;color:inherit;min-width:0}
.blocked-note{padding:16px;text-align:center;font-size:13px;color:#475569;background:#eef2ff}
body.dark .blocked-note{background:#0f172a;color:#cbd5e1}
.send,.mic-btn{width:44px;height:44px;border:none;border-radius:50%;background:#2563eb;color:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mic-btn{background:#fff;color:#2563eb}
body.dark .mic-btn{background:#1e293b;color:#93c5fd}

/* Voice recording bar */
.rec-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#eef2ff}
body.dark .rec-bar{background:#0f172a}
.rec-bar .trash{color:#dc2626}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#dc2626;animation:pulse 1s infinite;flex-shrink:0}
.rec-bar.paused .rec-dot{background:#94a3b8;animation:none}
.rec-time{font-weight:700;font-variant-numeric:tabular-nums}
.rec-state{flex:1;font-size:13px;color:#64748b}
.rec-bar .pl{display:none}
