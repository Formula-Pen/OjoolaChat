<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OjoolaChat</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{margin:0;background:linear-gradient(135deg,#2563eb,#1e40af);min-height:100vh;color:#fff}
.wrap{max-width:520px;margin:0 auto;padding:20px 14px}
.logo{font-size:28px;font-weight:800;text-align:center;margin-top:18px}
.sub{text-align:center;opacity:.9;margin:8px 0 20px}
.card{background:#fff;color:#111;border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
h2{margin:0 0 6px;font-size:22px}
p.muted{color:#666;font-size:14px;margin:0 0 16px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin-bottom:12px;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button.sec{background:#eef2ff;color:#2563eb;margin-top:10px}
#msg{color:#dc2626;font-size:13px;min-height:18px;text-align:center;margin-top:10px}
#chatCard{display:none}
#messages{height:380px;overflow-y:auto;padding:10px;margin-bottom:12px;background:#eef2ff;border-radius:14px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:80%;padding:9px 11px;border-radius:14px;font-size:14px;line-height:1.4;word-break:break-word;position:relative}
.bubble.mine{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:4px}
.bubble.theirs{align-self:flex-start;background:#fff;color:#111;border:1px solid #e5e7eb;border-bottom-left-radius:4px}
.bubble b{font-size:12px;display:block;opacity:.8}
.bubble small{font-size:11px;opacity:.7;display:block;text-align:right;margin-top:4px}
.del{font-size:11px;cursor:pointer;opacity:.7;margin-top:4px;display:inline-block;text-decoration:underline}
.row{display:flex;gap:8px}
.row input{margin:0}
.row button{width:90px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top button{width:auto;padding:8px 14px;background:#fee2e2;color:#991b1b;font-size:13px}
.badge{text-align:center;background:#dcfce7;color:#166534;padding:8px;border-radius:10px;font-size:13px;margin-bottom:12px}
.hint{font-size:12px;color:#666;margin:-6px 0 12px}
.pass-wrap{position:relative;margin-bottom:12px}
.pass-wrap input{margin-bottom:0;padding-right:48px}
.eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;padding:0;background:transparent;color:#666;font-size:18px;border-radius:50%}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">💬 OjoolaChat</div>
<div class="sub">Connect with Family and Friends</div>

<div class="card" id="authCard">
<h2 id="authTitle">Welcome back</h2>
<p class="muted" id="authSub">Login with your email to continue.</p>
<input id="nameInput" placeholder="Your Name (for Sign Up only)" style="display:none">
<input id="emailInput" type="email" placeholder="Email address">
<div class="pass-wrap">
<input id="passInput" type="password" placeholder="Password (min 8: letter + number + symbol)">
<button type="button" class="eye-btn" id="eyeBtn">👁️</button>
</div>
<div class="hint">Password must be at least 8 characters with letter, number & symbol. e.g. Ojoola@123</div>
<button id="mainBtn">Login</button>
<button class="sec" id="toggleBtn">Don't have account? Create Account</button>
<div id="msg"></div>
<div style="text-align:center;margin-top:14px;font-size:12px;color:#999">✅ Firebase Connected • ojoolachat</div>
</div>

<div class="card" id="chatCard">
<div class="top"><div><b id="userLabel">Chat</b><div style="font-size:12px;color:#666">Family & Friends • Group Chat</div></div><button id="logoutBtn">Logout</button></div>
<div class="badge">✅ Connected to Firebase</div>
<div id="messages"></div>
<div class="row"><input id="textInput" placeholder="Type a message..."><button id="sendBtn">Send</button></div>
<div id="msg2" style="color:#dc2626;font-size:13px;min-height:18px;text-align:center;margin-top:8px"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBXU6HnCTOAabLEyc3NANNLgZi3OJYpGVk",
  authDomain: "ojoolachat.firebaseapp.com",
  projectId: "ojoolachat",
  storageBucket: "ojoolachat.firebasestorage.app",
  messagingSenderId: "30543009981",
  appId: "1:30543009981:web:10c2641baa64864f96ffd4"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let isSignup = false;
let unsub = null;
const authCard = document.getElementById('authCard');
const chatCard = document.getElementById('chatCard');
const msg = document.getElementById('msg');
const passInput = document.getElementById('passInput');
const eyeBtn = document.getElementById('eyeBtn');

eyeBtn.onclick = () => {
  const isHidden = passInput.type === 'password';
  passInput.type = isHidden ? 'text' : 'password';
  eyeBtn.textContent = isHidden ? '🙈' : '👁️';
};
function isStrongPassword(pass){
  if(pass.length < 8) return false;
  return /[A-Za-z]/.test(pass) && /[0-9]/.test(pass) && /[^A-Za-z0-9]/.test(pass);
}
document.getElementById('toggleBtn').onclick = () => {
  isSignup = !isSignup;
  document.getElementById('authTitle').textContent = isSignup ? 'Create Account' : 'Welcome back';
  document.getElementById('authSub').textContent = isSignup ? 'Create account with email to join.' : 'Login with your email to continue.';
  document.getElementById('nameInput').style.display = isSignup ? 'block' : 'none';
  document.getElementById('mainBtn').textContent = isSignup ? 'Create Account' : 'Login';
  document.getElementById('toggleBtn').textContent = isSignup ? 'Already have account? Login' : "Don't have account? Create Account";
  msg.textContent = '';
};
