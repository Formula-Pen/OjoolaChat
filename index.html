<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OjoolaChat - Made for Family and Friends</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. SPLASH -->
<div id="splash" class="screen active center">
<div class="logoBox"><div class="logoInner">💬💙</div></div>
<h1>OjoolaChat</h1>
<p class="tag">Made for Family and Friends</p>
<p class="small">Safe • Secure • Fast</p>
<button class="btn btnWhite" onclick="showScreen('login')">Get Started →</button>
</div>

<!-- 2. LOGIN -->
<div id="login" class="screen center">
<div class="logoBox smallLogo"><div class="logoInner smallInner">💬💙</div></div>
<h1 class="title2">Welcome Back</h1>
<p class="tag">Login with your phone number</p>
<div class="whiteCard">
<label>Phone Number</label>
<input id="phoneInput" placeholder="+234 801 234 5678">
<button class="btn" onclick="showScreen('chats')">Continue →</button>
<p class="hint">We will send you a code to verify</p>
</div>
</div>

<!-- 3. CHAT LIST -->
<div id="chats" class="screen lightBg">
<div class="top"><div><h2>Chats</h2><p class="sub">3 chats • 2 online</p></div><button class="pill" onclick="toggleDark()">🌙 Dark</button></div>
<input id="searchInput" placeholder="🔍 Search family & friends..." oninput="filterChats()">
<div id="chatList">
